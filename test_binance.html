<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Binance — проверка</title>
    <style>
        body {
            background: #070a11;
            color: #d6e2ff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .result {
            background: #0f1726;
            border: 1px solid #2a3a52;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .success { color: #6fcf97; }
        .error { color: #ff6b6b; }
        .loading { color: #f5b042; }
        .price {
            font-size: 32px;
            font-weight: bold;
            color: #f5d77b;
        }
        .raw {
            background: #0a0f1a;
            border: 1px solid #1a2a3a;
            border-radius: 6px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 11px;
            color: #6a7a9a;
            overflow: auto;
            max-height: 200px;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .note {
            background: #1a1025;
            border: 1px solid #6a4a9a;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 13px;
            color: #c4b8e0;
        }
    </style>
</head>
<body>

    <h2>🔬 Binance — проверка (3 способа)</h2>
    <div id="status" class="loading">⏳ Загрузка...</div>
    <div id="price" class="price">---</div>
    <div class="raw" id="raw">Ожидание...</div>
    
    <div class="note">
        🔍 Проверяем 3 способа получить цену с Binance:
        <br>1. allorigins.win (работал раньше)
        <br>2. corsproxy.io
        <br>3. cors-anywhere
    </div>

    <script>
        // ============================================================
        //  ★★★ BINANCE — 3 СПОСОБА ★★★
        // ============================================================

        const statusEl = document.getElementById('status');
        const priceEl = document.getElementById('price');
        const rawEl = document.getElementById('raw');

        const proxies = [
            {
                name: 'allorigins.win',
                url: 'https://api.allorigins.win/raw?url=',
                target: 'https://api.binance.com/api/v3/ticker/price?symbol=XAUUSDT'
            },
            {
                name: 'corsproxy.io',
                url: 'https://corsproxy.io/?',
                target: 'https://api.binance.com/api/v3/ticker/price?symbol=XAUUSDT'
            },
            {
                name: 'cors-anywhere',
                url: 'https://cors-anywhere.herokuapp.com/',
                target: 'https://api.binance.com/api/v3/ticker/price?symbol=XAUUSDT'
            }
        ];

        async function testProxy(proxy) {
            try {
                const resp = await fetch(proxy.url + encodeURIComponent(proxy.target));
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (data && data.price) {
                    return data.price;
                }
                throw new Error('Цена не найдена');
            } catch (e) {
                throw e;
            }
        }

        async function fetchBinance() {
            statusEl.textContent = '⏳ Проверка всех способов...';
            statusEl.className = 'loading';
            rawEl.textContent = '';

            for (let proxy of proxies) {
                try {
                    statusEl.textContent = '⏳ Пробуем: ' + proxy.name;
                    const price = await testProxy(proxy);
                    const rounded = Math.round(parseFloat(price));
                    priceEl.textContent = '$' + rounded;
                    statusEl.textContent = '✅ Успешно! (' + proxy.name + ')';
                    statusEl.className = 'success';
                    rawEl.textContent = 'Работает: ' + proxy.name + '\nЦена: ' + price;
                    return;
                } catch (error) {
                    rawEl.textContent += '❌ ' + proxy.name + ': ' + error.message + '\n';
                }
            }

            // Если ничего не сработало
            statusEl.textContent = '❌ Ни один способ не сработал';
            statusEl.className = 'error';
            priceEl.textContent = '❌';
            rawEl.textContent += '\n⚠️ Все прокси не отвечают. Возможно, проблема на GitHub Pages.';
        }

        // ============================================================
        //  Запуск
        // ============================================================
        fetchBinance();
    </script>
</body>
</html>
